# ==============================================================================
# Generated by Zero-Config CI/CD Engine
# Workflow: Node.js CI, Python CI (2 jobs)
# Configuration: Parallel DAG | Dependency Caching: Enabled | Production Hardening: Enabled
# ==============================================================================

name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-node:
    name: Node.js CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
  test-python:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: pip
      - run: pytest
