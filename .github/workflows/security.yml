# ==============================================================================
# Generated by Zero-Config CI/CD Engine
# Security & Vulnerability Scanning Workflow (Level: standard)
# ==============================================================================

name: Security & Vulnerability Scans
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run npm-audit
        run: npm audit --audit-level=high
      - name: Run pip-audit
        run: pip-audit
