# ==============================================================================
# Generated by Zero-Config CI/CD Engine
# Security & Vulnerability Scanning Workflow (Level: standard)
# ==============================================================================

name: Security & Vulnerability Scans
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run npm-audit
        run: if [ -f package-lock.json ]; then npm audit --audit-level=high; else for dir in $(find . -name 'package-lock.json' -not -path '*/node_modules/*' -exec dirname {} \;); do (cd "$dir" && echo "Auditing $dir..." && npm audit --audit-level=high); done; fi
        continue-on-error: true
      - name: Run pip-audit
        run: pip install pip-audit && if [ -f requirements.txt ]; then pip-audit -r requirements.txt; else for req in $(find . -name 'requirements.txt' -not -path '*/.*'); do echo "Auditing $req..." && pip-audit -r "$req"; done; fi
        continue-on-error: true
